<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe 4×4 — Perfectly Solved</title>
  <meta name="description" content="A fully solved 4×4 Tic-Tac-Toe game powered by a C++ minimax engine compiled to WebAssembly. Perfect play guaranteed." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Tic-Tac-Toe <span class="dim">4×4</span></h1>
      <p class="subtitle">Perfectly solved · Play as <span id="humanLabel" class="highlight">—</span></p>
    </header>

    <!-- Side selection screen -->
    <section id="sideSelect">
      <p class="prompt">Choose your side</p>
      <div class="side-buttons">
        <button id="btnX" class="side-btn x-btn" aria-label="Play as X">X</button>
        <button id="btnO" class="side-btn o-btn" aria-label="Play as O">O</button>
      </div>
      <p class="engine-status" id="engineStatus">Loading engine…</p>
    </section>

    <!-- Game board -->
    <section id="gameSection" class="hidden">
      <div id="board" class="board" role="grid" aria-label="4 by 4 game board">
        <!-- 16 cells injected by JS -->
      </div>
      <div id="statusBar" class="status-bar">
        <span id="statusText">Your turn</span>
      </div>
      <button id="btnRestart" class="restart-btn">↩ Play Again</button>
    </section>

    <footer>
      <p>Engine: C++ Minimax + Alpha-Beta + D₈ Symmetry →
         <a href="https://emscripten.org" target="_blank" rel="noopener">WebAssembly</a></p>
    </footer>
  </div>

  <!-- WASM engine (generated by emcc) -->
  <script src="public/engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
